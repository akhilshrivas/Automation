name: Daily Repository Update

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allow manual testing of the workflow
  workflow_dispatch:

# Ensure the workflow has the minimum permissions needed to push code
permissions:
  contents: write

jobs:
  daily_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Automatically detect and checkout the default branch (do not assume main/master)
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Git User
        run: |
          # Use the GitHub Actions bot email and name to ensure correct attribution
          # This acts as the repository bot, making it clear this is automated activity
          # If you want this to map directly to your personal user contribution graph, 
          # you would replace the email below with your GitHub noreply email address.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Perform Daily Update
        run: |
          # Append a meaningful log entry showing automated health check completion
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "- [x] Automated system check completed successfully on $DATE" >> ACTIVITY_LOG.md

      - name: Check for changes and Commit
        run: |
          # Stage the specific file to avoid accidental commits of other changed files
          git add ACTIVITY_LOG.md
          
          # Check if there are actual changes in the staging area using git diff
          # --quiet exits with 0 if there are no changes, and 1 if there are changes
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit to avoid empty commits."
            exit 0
          fi
          
          # Commit the changes; only runs if there is an actual difference
          git commit -m "chore: automated daily repository maintenance log update"
          
      - name: Push to default branch
        run: |
          # Safely push to the dynamically detected default branch
          # Avoids force push and strictly uses the default branch reference
          git push origin HEAD:${{ github.event.repository.default_branch }}
